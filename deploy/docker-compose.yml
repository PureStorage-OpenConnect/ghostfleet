services:
  core:
    image: ghostfleet-controller:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.controller
      args:
        VERSION: ${GHOSTFLEET_VERSION:-dev}
    restart: unless-stopped
    ports:
      # The controller serves the UI/API and the /boot + /agent endpoints on a
      # single container port (8080). Publish it on the standard HTTP port for
      # the management UI, and keep 8080 because the isolated-network boot chain
      # targets the host ULA at :8080 (embed.ipxe, -boot-url) — both map to the
      # same container port, so nothing in the boot chain changes.
      - "80:8080"
      - "8080:8080"
    environment:
      # Optional UI/API password (UI-1); empty = open access.
      - GHOSTFLEET_PASSWORD=${GHOSTFLEET_PASSWORD:-}
      # Optional static API keys for automation (comma-separated). Accepted via
      # Authorization: Bearer / X-API-Key header, or ?apikey= (query leaks into
      # logs — prefer a header). Configuring any also turns the API gate on.
      - GHOSTFLEET_API_KEYS=${GHOSTFLEET_API_KEYS:-}
      # Discovery of unknown VMs (restored ghost VMs); on by default, "off" disables.
      - GHOSTFLEET_DISCOVERY=${GHOSTFLEET_DISCOVERY:-}
      # Secure attribute on the session cookie: on / off / empty = auto
      # (Secure when the request came over TLS or X-Forwarded-Proto: https).
      - GHOSTFLEET_SECURE_COOKIES=${GHOSTFLEET_SECURE_COOKIES:-}
    volumes:
      - state:/var/lib/ghostfleet
      - images:/var/lib/ghostfleet/images:ro
    depends_on:
      tempos:
        condition: service_completed_successfully

  # One-shot: builds the temp OS (kernel + initramfs with the agent) and
  # installs the artifacts into the images volume.
  tempos:
    image: ghostfleet-tempos:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.tempos
      args:
        VERSION: ${GHOSTFLEET_VERSION:-dev}
    restart: "no"
    volumes:
      - images:/out

  # RA + DHCPv6 + TFTP on the isolated interface. Needs host networking
  # (link-local multicast) — it binds only to GHOSTFLEET_ISOLATED_IF.
  netboot:
    image: ghostfleet-netboot:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile.netboot
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      - GHOSTFLEET_ISOLATED_IF=${GHOSTFLEET_ISOLATED_IF:-ens34}

volumes:
  state:
  images:
